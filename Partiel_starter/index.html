<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
     <title>Tristan Da Silva - Partiel Harry Potter</title>
  </head>
  <body>
   
    <main>
       <header class="header">
      <div class="header__right">
        <img src="./images/logo/logo.png" />
      </div>
      <div class="header__left">
        <h1>Tristan Da Silva - Wiki Harry Potter</h1>
   
        <img src="./images/menu.png" alt="" srcset="" />
      </div>
    </header>
      <section>
        <h3>HOUSES</h3>
        <div class="houses">
          <div data-house="Gryffindor">
            <img src="./images/logo/Gryffindor.png" alt="Emblème de Gryffondor" />
          </div>
          <div data-house="Hufflepuff">
            <img src="./images/logo/Hufflepuff.png" alt="Emblème de Poufsouffle" />
          </div>
          <div data-house="Ravenclaw">
            <img src="./images/logo/Ravenclaw.png" alt="Emblème de Serdaigle" />
          </div>
          <div data-house="Slytherin">
            <img src="./images/logo/Slytherin.png" alt="Emblème de Serpentard" />
          </div>
        </div>
      </section>
      <section>
        <h3>Characters</h3>
        <div class="characters" id="characters"></div>
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
    <script src="./js/characters.js" defer></script>
  </body>
</html>
