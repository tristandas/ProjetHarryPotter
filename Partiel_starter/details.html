<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/style.css" />
    <title>Tristan Da Silva - Partiel Harry Potter</title>
  </head>
  <body class="page_perso">
    <header class="header">
      <div class="header__right">
        <a href="index.html">
        <img src="./images/logo/logo.png" />
    </a>
 </div>
      <div class="header__left">
        <h1>Tristan Da Silva - Partiel Harry Potter</h1>
        <ul>
          <li>Students</li>
          <li>Staff</li>
          <li>Houses</li>
          <li>Spells</li>
        </ul>
        <img src="./images/menu.png" alt="" srcset="" />
      </div>
    </header>
    <main>
      <section>
        <h3 id="character-name"></h3>
        <div class="perso">
          <figure class="perso__left">
            <img id="character-image" src="./images/troll.jpg" alt="" />
            <figcaption id="character-actor"></figcaption>
          </figure>
          <div class="perso__right">
            <div>
              <p>Gender</p>
              <p class="attr" id="character-gender"></p>
            </div>
            <div>
              <p>Eye</p>
              <p class="attr" id="character-eyes"></p>
            </div>
            <div>
              <p>Hair</p>
              <p class="attr" id="character-hair"></p>
            </div>
            <div>
              <p>Date of birth</p>
              <p class="attr" id="character-birth"></p>
            </div>
            <div>
              <p>Patronus</p>
              <p class="attr" id="character-patronus"></p>
            </div>
            <div>
              <p>Surnom</p>
              <p class="attr" id="character-nickname"></p>
            </div>
          </div>
        </div>
      </section>
      <section class="house__perso">
        <img id="house-image" src="./images/troll.jpg" alt="" />
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
    <script src="./js/details.js" defer></script>
  </body>
</html>
